name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim
        env:
          ORACLE_PASSWORD: "1234"
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 120s

    env:
      DB_URL: jdbc:oracle:thin:@localhost:1521/XEPDB1
      DB_USERNAME: system
      DB_PASSWORD: "1234"
      JWT_SECRET: ci-test-jwt-secret-key-minimum-32-chars

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw test

  deploy:
    needs: test

    # PR에서는 배포하지 않고 main push일 때만 실행
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy to EC2 with SSM
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy meeting-api from GitHub Actions" \
            --parameters 'commands=[
              "sudo -u ec2-user -H bash -lc '\''set -e; cd /home/ec2-user/meeting-api && git pull --ff-only origin main && docker compose up -d --build'\'' && for i in $(seq 1 12); do curl -fsS http://localhost/actuator/health > /dev/null 2>&1 && echo Health check succeeded && exit 0; echo Health check attempt $i failed, retrying in 5s...; sleep 5; done; echo Health check failed after 60s >&2; exit 1"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

      - name: Show deployment result
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{
              Status:Status,
              Output:StandardOutputContent,
              Error:StandardErrorContent
            }'